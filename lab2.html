<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Programming Practice Platform</title>
    <link rel="stylesheet" href="assets/css/styles_lab2.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
</head>
<body class="min-h-screen flex flex-col">
    <div id="particles-js"></div>

    <nav class="toolbar">
        <button id="backButton" class="btn">Back</button>
        <div></div> <!-- Khoảng trống giữa các nút -->
        <button id="darkModeToggle" class="btn">Toggle Dark Mode</button>
    </nav>

    <nav class="bg-gray-800 text-white p-4">
        <ul class="flex justify-center space-x-4">
            <li><a href="#" class="tab-link" data-tab="login">Login</a></li>
            <li><a href="#" class="tab-link" data-tab="exercises">Exercises</a></li>
            <li><a href="#" class="tab-link" data-tab="coding">Coding</a></li>
            <li><a href="#" class="tab-link" data-tab="grading">Grading</a></li>
        </ul>
    </nav>

    <main class="flex-grow container mx-auto p-4">
        <div id="login" class="tab-content active">
            <div class="neumorphic max-w-md mx-auto">
                <h2 class="text-2xl font-bold mb-4">Login</h2>
                <form id="loginForm">
                    <div class="mb-4">
                        <label for="username" class="block mb-2">Username/Email</label>
                        <input type="text" id="username" name="username" required class="w-full p-2 rounded">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="block mb-2">Password</label>
                        <input type="password" id="password" name="password" required class="w-full p-2 rounded">
                    </div>
                    <button type="submit" class="btn w-full">Login</button>
                </form>
                <a href="#" class="block mt-4 text-center text-blue-500">Forgot Password?</a>
            </div>
        </div>

        <div id="exercises" class="tab-content">
            <div class="neumorphic">
                <h2 class="text-2xl font-bold mb-4">Exercise List</h2>
                <div class="mb-4">
                    <label for="languageFilter" class="block mb-2">Filter by Language:</label>
                    <select id="languageFilter" class="w-full p-2 rounded">
                        <option value="all">All</option>
                        <option value="c">C</option>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                    </select>
                </div>
                <div class="mb-4">
                    <input type="text" id="searchExercise" placeholder="Search exercises..." class="w-full p-2 rounded">
                </div>
                <ul id="exerciseList" class="space-y-4">
                    <!-- Exercise items will be dynamically added here -->
                </ul>
            </div>
        </div>

        <div id="coding" class="tab-content">
            <div class="neumorphic">
                <h2 id="exerciseTitle" class="text-2xl font-bold mb-4">Exercise Title</h2>
                <p id="exerciseDescription" class="mb-4">Exercise description will appear here.</p>
                <div class="mb-4">
                    <label for="languageSelect" class="block mb-2">Select Language:</label>
                    <select id="languageSelect" class="w-full p-2 rounded">
                        <option value="c">C</option>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                    </select>
                </div>
                <textarea id="codeEditor"></textarea>
                <div class="mt-4 space-x-2">
                    <button id="runCode" class="btn">Run Code</button>
                    <button id="clearCode" class="btn">Clear Code</button>
                    <button id="submitCode" class="btn">Submit Code</button>
                </div>
                <div id="output" class="mt-4 p-4 bg-gray-100 rounded"></div>
            </div>
        </div>

        <div id="grading" class="tab-content">
            <div class="neumorphic">
                <h2 class="text-2xl font-bold mb-4">Grading Results</h2>
                <div id="gradingStatus" class="mb-4 font-bold"></div>
                <div id="testCases" class="space-y-4"></div>
                <div id="score" class="mt-4 font-bold"></div>
                <div id="performance" class="mt-4"></div>
                <div class="mt-4 space-x-2">
                    <button id="retryExercise" class="btn">Retry Exercise</button>
                    <button id="backToDashboard" class="btn">Back to Dashboard</button>
                </div>
                <div class="mt-4">
                    <textarea id="feedback" placeholder="Leave your feedback or ask for help..." class="w-full p-2 rounded"></textarea>
                    <button id="submitFeedback" class="btn mt-2">Submit Feedback</button>
                </div>
                <button id="getHint" class="btn mt-4">Get Hint</button>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-white p-4 text-center">
        <p>&copy; 2023 Online Programming Practice Platform. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
</body>
<script src="assets/js/script_lab2.js"></script>
</html>
