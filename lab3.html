
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chia Sẻ Tài Liệu Học Tập Cho Sinh Viên</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles_lab3.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <span>EduShare</span>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Tìm kiếm tài liệu...">
                <i class="fas fa-search"></i>
            </div>
        </nav>
        <h1>Chia Sẻ Tài Liệu Học Tập Cho Sinh Viên</h1>
    </header>

    <main>
        <section id="subjectList" class="subject-list">
            <h2>Danh Mục Môn Học</h2>
            <div class="subject-cards">
                <div class="subject-card" data-subject="giao-tiep-nguoi-may">
                    <i class="fas fa-robot"></i>
                    <h3>Giao tiếp người máy</h3>
                </div>
                <div class="subject-card" data-subject="toan-roi-rac">
                    <i class="fas fa-calculator"></i>
                    <h3>Toán rời rạc</h3>
                </div>
                <div class="subject-card" data-subject="cau-truc-du-lieu">
                    <i class="fas fa-database"></i>
                    <h3>Cấu trúc dữ liệu</h3>
                </div>
            </div>
        </section>

        <section id="subjectContent" class="subject-content hidden">
            <button id="backButton" class="back-button"><i class="fas fa-arrow-left"></i> Quay lại</button>
            <h2 id="subjectTitle"></h2>
            <div id="materialList" class="material-list"></div>
            <button id="shareButton" class="share-button"><i class="fas fa-upload"></i> Chia sẻ tài liệu</button>
        </section>

        <div id="shareModal" class="modal hidden">
            <div class="modal-content">
                <h3>Chia sẻ tài liệu mới</h3>
                <form id="shareForm">
                    <input type="text" id="materialName" placeholder="Tên tài liệu" required>
                    <select id="materialType" required>
                        <option value="">Chọn loại tài liệu</option>
                        <option value="bai-giang">Bài giảng</option>
                        <option value="bai-tap">Bài tập</option>
                        <option value="tai-lieu-tham-khao">Tài liệu tham khảo</option>
                    </select>
                    <input type="file" id="materialFile" required>
                    <div class="form-buttons">
                        <button type="submit">Tải lên</button>
                        <button type="button" id="cancelShare">Hủy</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2023 EduShare. Tất cả quyền được bảo lưu.</p>
            <div class="social-links">
                <a href="#" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="#" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>
</body>
<script src="assets/js/script_lab3.js"></script>

</html>
